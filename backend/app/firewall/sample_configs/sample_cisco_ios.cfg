version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname EDGE-RTR-01
!
enable secret 5 $1$abcd$examplehashvalue00
!
no ip domain lookup
!
snmp-server community public RO
snmp-server community private RW
!
line con 0
 exec-timeout 10 0
line vty 0 4
 transport input telnet
 exec-timeout 0 0
line vty 5 15
 transport input ssh telnet
!
interface GigabitEthernet0/0
 description WAN-UPLINK
 ip address 203.0.113.1 255.255.255.0
 ip access-group ACL-INGRESS in
 ip access-group ACL-EGRESS out
!
interface GigabitEthernet0/1
 description LAN-CORE
 ip address 10.10.0.1 255.255.255.0
!
ip access-list extended ACL-INGRESS
 permit tcp any any eq 22
 permit tcp any any eq 23
 permit tcp any any eq 3389
 permit tcp any any eq 445
 permit tcp any any eq 3306
 permit tcp any any eq 5432
 permit tcp any host 10.10.0.1 eq 80
 permit udp any any eq 161
 deny ip any any log
!
ip access-list extended ACL-EGRESS
 permit ip any any
!
end
