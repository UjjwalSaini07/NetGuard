! =========================================================================
! ADVANCED HARDENED CISCO IOS CONFIGURATION
! Consolidated from: hardened_cisco_ios.cfg + sample_cisco_ios.cfg
! Adds: AAA, SSHv2 enforcement, SNMPv3, NTP auth, CoPP, login rate-limiting,
!       tighter ACLs, DHCP/ARP hardening, logging buffer, archive logging
! Review all placeholder values (marked <>) before deploying.
! =========================================================================

version 15.2
no service pad
service tcp-keepalives-in
service tcp-keepalives-out
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service sequence-numbers
!
hostname SECURE-CORE-01
!
boot-start-marker
boot-end-marker
!
no ip domain lookup
ip domain name <yourdomain.local>
!
! --- Local + AAA authentication (defense in depth; replace RADIUS/TACACS+
!     host/key with your real AAA server before deploying) -------------
username netadmin privilege 15 secret 5 $1$abcd$replaceWithRealHash00
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authentication enable default group tacacs+ enable
aaa authorization exec default group tacacs+ local if-authenticated
aaa authorization commands 15 default group tacacs+ local if-authenticated
aaa accounting exec default start-stop group tacacs+
aaa accounting commands 15 default start-stop group tacacs+
!
tacacs server TACACS-PRIMARY
 address ipv4 10.10.0.60
 key <tacacs-shared-key>
!
enable secret 5 $1$abcd$securehashvalue00
!
! --- Password / login hardening ---------------------------------------
security passwords min-length 12
login block-for 120 attempts 4 within 60
login delay 2
login on-failure log
login on-success log
!
! --- Logging -------------------------------------------------------------
logging buffered 65536 informational
logging trap informational
logging host 10.10.0.50
logging source-interface GigabitEthernet0/1
logging facility local6
service sequence-numbers
archive
 log config
  logging enable
  logging size 500
  notify syslog contains-update
  hidekeys
!
! --- Time sync (authenticated NTP, not the sample's cleartext NTP) -------
ntp authenticate
ntp authentication-key 1 md5 <ntp-shared-key>
ntp trusted-key 1
ntp server 10.10.0.100 key 1
!
! --- SNMP: replace "no snmp-server" and the sample's public/private
!     community strings with SNMPv3 (authPriv) ---------------------------
snmp-server group SNMP-ADMINS v3 priv
snmp-server user snmpadmin SNMP-ADMINS v3 auth sha <auth-passphrase> priv aes 128 <priv-passphrase>
snmp-server host 10.10.0.50 version 3 priv snmpadmin
no snmp-server community public
no snmp-server community private
snmp-server contact <netops@yourdomain.local>
snmp-server location <DC1-RACK-14>
!
banner login ^C
AUTHORIZED ACCESS ONLY. ALL SESSIONS MONITORED AND AUDITED.
Unauthorized access is prohibited and may result in prosecution.
^C
!
! --- Console / VTY: SSHv2 only, no telnet anywhere ------------------------
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh source-interface GigabitEthernet0/1
crypto key generate rsa modulus 2048
!
line con 0
 login authentication default
 exec-timeout 10 0
 logging synchronous
line aux 0
 no exec
 transport input none
line vty 0 15
 login authentication default
 transport input ssh
 exec-timeout 5 0
 access-class VTY-ACCESS in
 logging synchronous
!
! Restrict which hosts may even attempt VTY login (sample had this wide open)
ip access-list standard VTY-ACCESS
 permit 10.10.0.0 0.0.0.255
 deny   any log
!
! --- Interfaces ------------------------------------------------------------
interface GigabitEthernet0/0
 description WAN-UPLINK
 ip address 203.0.113.1 255.255.255.0
 ip access-group ACL-INGRESS in
 ip access-group ACL-EGRESS out
 ip verify unicast source reachable-via rx allow-default
 no ip redirects
 no ip proxy-arp
 no ip unreachables
 no cdp enable
!
interface GigabitEthernet0/1
 description LAN-CORE
 ip address 10.10.0.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
 ip dhcp snooping trust
!
! --- Global anti-spoofing / recon hardening -------------------------------
no ip source-route
no ip http server
no ip http secure-server
no ip bootp server
no cdp run
no lldp run
ip dhcp snooping
ip dhcp snooping vlan 1
!
! --- ACLs: tightened vs. both source files ---------------------------------
! Ingress: only management SSH from internal mgmt subnet + HTTPS to the
! public-facing host; everything else explicitly denied and logged
! (the sample file had SSH/Telnet/RDP/SMB/MySQL/Postgres/SNMP wide open
! to "any" — all removed here).
ip access-list extended ACL-INGRESS
 remark -- anti-spoof: deny inbound traffic claiming to be from our own space --
 deny ip 10.10.0.0 0.0.0.255 any log
 deny ip 203.0.113.0 0.0.0.255 any log
 deny ip 127.0.0.0 0.0.0.255 any log
 remark -- legitimate management/service traffic --
 permit tcp 10.10.0.0 0.0.0.255 host 10.10.0.1 eq 22
 permit tcp any host 10.10.0.1 eq 443
 permit icmp any host 10.10.0.1 echo-reply
 permit icmp any host 10.10.0.1 time-exceeded
 permit icmp any host 10.10.0.1 unreachable
 deny ip any any log
!
ip access-list extended ACL-EGRESS
 permit tcp any any eq 443
 permit udp any any eq 53
 permit udp host 10.10.0.100 any eq 123
 deny ip any any log
!
! --- Control Plane Policing: protects the router CPU itself from
!     management-plane floods/DoS (neither source file had this) ----------
ip access-list extended COPP-CRITICAL
 permit tcp 10.10.0.0 0.0.0.255 host 10.10.0.1 eq 22
 permit udp host 10.10.0.100 host 10.10.0.1 eq 123
 permit udp host 10.10.0.50 host 10.10.0.1 eq 514

!
class-map match-all COPP-CRITICAL-CLASS
 match access-group name COPP-CRITICAL
!
policy-map COPP-POLICY
 class COPP-CRITICAL-CLASS
  police 512000 8000 conform-action transmit exceed-action drop
 class class-default
  police 64000 8000 conform-action transmit exceed-action drop
!
control-plane
 service-policy input COPP-POLICY
!
! --- Misc hardening ---------------------------------------------------------
no service config
no vstack
!
end
