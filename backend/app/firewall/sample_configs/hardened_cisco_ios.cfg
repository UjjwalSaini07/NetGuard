version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname SECURE-CORE-01
!
enable secret 5 $1$abcd$securehashvalue00
!
no ip domain lookup
!
logging host 10.10.0.50
!
ntp server 10.10.0.100
!
banner login ^C
AUTHORIZED ACCESS ONLY. ALL SESSIONS MONITORED AND AUDITED.
^C
!
snmp-server community NetGuardSec99 RO
!
line con 0
 exec-timeout 10 0
line vty 0 15
 transport input ssh
 exec-timeout 5 0
!
interface GigabitEthernet0/0
 description WAN-UPLINK
 ip address 203.0.113.1 255.255.255.0
 ip access-group ACL-INGRESS in
 ip access-group ACL-EGRESS out
!
interface GigabitEthernet0/1
 description LAN-CORE
 ip address 10.10.0.1 255.255.255.0
!
ip access-list extended ACL-INGRESS
 permit tcp 10.10.0.0 0.0.0.255 host 10.10.0.1 eq 22
 permit tcp any host 10.10.0.1 eq 443
 deny ip any any log
!
ip access-list extended ACL-EGRESS
 permit tcp any any eq 443
 permit udp any any eq 53
 deny ip any any
!
end
